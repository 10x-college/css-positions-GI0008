<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positions</title>
    <link rel="stylesheet" href="1styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dr+Sugiyama&family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap" rel="stylesheet">
</head>
<body>
    <main class="main-box">
        <div class="main-div">
            <div class="oval"></div>
            <div class="oval"></div>
            <div class="box">
                <h3 class="name">Victor Crest</h3>
                <span class="age">26</span>
                <span class="city">London</span>
                <div class="circle-photo"></div>
                <div class="div-bck"></div>
                <div class="div-bottom">
                    <div class="div-text">
                        <h3 class="div-text-h3">80K</h3>
                        <h3 class="div-text-h3">803K</h3>
                        <h3 class="div-text-h3">1.4K</h3>
                        <div class="small-text-div">
                            <strong class="small-text">Followers</strong>
                            <strong class="small-text">Likes</strong>
                            <strong class="small-text">Photos</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </main>
</body>
</html>
